    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Volt-Flow Circuit Simulator</title>
    <meta name="description" content="Interactive electrical circuit simulator with DC and AC analysis, real-time charge flow visualization, bilingual English and Bisaya support, and comprehensive circuit diagnostics." />
    <meta property="og:title" content="Volt-Flow Circuit Simulator" />
    <meta property="og:description" content="Interactive electrical circuit simulator with DC and AC analysis, real-time charge flow visualization, bilingual English and Bisaya support, and comprehensive circuit diagnostics." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/png" href="./icons/volt-flow-192.png" />
    <link rel="apple-touch-icon" href="./icons/volt-flow-192.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#121620" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

  <body class="bg-[#121620] text-[#e8eaf0] antialiased select-none overflow-hidden h-screen w-screen">
    <div id="root" class="h-full w-full"></div>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('./sw.js').then(function(reg) {
            console.log('Volt-Flow ServiceWorker registered:', reg.scope);
          }).catch(function(err) {
            console.warn('Volt-Flow ServiceWorker error:', err);
          });
        });
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
